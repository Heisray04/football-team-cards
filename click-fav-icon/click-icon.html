<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A simple HTML page to toggle favorite icons.">
        <title>Favorite Icon Toggler</title>
        <link rel="stylesheet" href="click-icon.css">
    </head>
    <body>
        <h1>Operating Systems</h1>
        <ul class="item-list">
            <p>Click the heart to select</p>
            <li>
                Windows
                <button class="favorite-icon">&#9825;</button>
            </li>
            <li>
                Linux
                <button class="favorite-icon">&#9825;</button>
            </li>
            <li>
                MacOS
                <button class="favorite-icon">&#9825;</button>
            </li>
            <li>
                Android
                <button class="favorite-icon">&#9825;</button>
            </li>
            <li>
                IOS
                <button class="favorite-icon">&#9825;</button>
            </li>
        </ul>
        <script src="click-icon.js"></script>
    </body>
</html>
