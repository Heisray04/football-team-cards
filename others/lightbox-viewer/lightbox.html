<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbox Viewer</title>
    <link rel="stylesheet" href="lightbox.css">
    <link rel="icon" href="../imgs/lightbox.jpg">
  </head>

  <body>
    <h2>Museum Gallery</h2>
    <div class="gallery">
      <img src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg" class="gallery-item" alt="stonehenge" title="stonehenge">
      <img src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg" class="gallery-item" alt="storm" title="storm">
      <img src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg" class="gallery-item" alt="trees" title="trees">
    </div>
    <div class="lightbox">
      <img id="lightbox-image">
      <button id="close-btn">&times;</button>
    </div>
    <div class="foot">
      <p>&copy; Lightbox image viewer 2026. Created By Raymond</p>
    </div>
    <script src="lightbox.js"></script>
  </body>

</html>
